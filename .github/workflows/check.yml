name: Comprobar Mini IA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas
        run: npm test
      - name: Comprobar entrenamiento de Python y cuaderno de Kaggle
        run: |
          python -m py_compile entrenar_v8.py
          python - <<'PY'
          import json
          with open("Mini_IA_8_Entrenamiento.ipynb", encoding="utf-8") as f:
              notebook = json.load(f)
          cells = [cell for cell in notebook["cells"] if cell["cell_type"] == "code"]
          for i, cell in enumerate(cells, 1):
              compile("".join(cell["source"]), f"celda-{i}", "exec")
          assert len(cells) >= 5
          print("Entrenamiento y notebook válidos:", len(cells), "celdas")
          PY
