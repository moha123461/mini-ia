name: Comprobar Mini IA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas
        run: npm test
      - name: Comprobar entrenamiento de Python y cuaderno de Kaggle
        run: |
          python -m py_compile entrenar_v8.py entrenar_v8_1.py entrenar_v9_clasificador.py
          python - <<'PY'
          import json
          for notebook_path in ("Mini_IA_8_Entrenamiento.ipynb", "Mini_IA_8_1_Entrenamiento.ipynb", "Mini_IA_9_Clasificador.ipynb"):
              with open(notebook_path, encoding="utf-8") as f:
                  notebook = json.load(f)
              cells = [cell for cell in notebook["cells"] if cell["cell_type"] == "code"]
              for i, cell in enumerate(cells, 1):
                  compile("".join(cell["source"]), notebook_path + f"/celda-{i}", "exec")
              assert len(cells) >= 5
              print("Cuaderno válido:", notebook_path, len(cells), "celdas")
          PY
